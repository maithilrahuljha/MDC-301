services:
  quiz:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      SOCKETIO_ASYNC_MODE: gevent
    volumes:
      - quiz_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz_net

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      quiz:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - quiz_net

volumes:
  quiz_data:
  caddy_data:
  caddy_config:

networks:
  quiz_net:
    driver: bridge
